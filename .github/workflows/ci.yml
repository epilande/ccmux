name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run check:unused
      - run: bun run build
      # The completion suite drives the generated fish script through fish's
      # own completion engine. Without fish on the runner those tests skip
      # silently, which is how a bad line in that script shipped once: every
      # other assertion about it is a substring match on the script text.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish
      - if: runner.os == 'macOS'
        run: brew install fish
      - name: Verify completion test shells
        run: |
          bash --version
          fish --version
      - run: bun test
