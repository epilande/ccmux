name: Release

on:
  push:
    branches: [main, release/1.4]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, smoke-test and generate the formulas, but publish nothing
        type: boolean
        default: false
      version:
        description: "Dry run only: version to build instead of package.json's"
        type: string
      branch:
        description: "Dry run only: branch to evaluate the release rules as"
        type: string

# Publishing is opt-in. Anything that holds write access or a publishing secret
# must be gated on `needs.guard.outputs.publish == 'true'`, spelled out: `build`
# is also true on a dry run.
permissions:
  contents: read

# The guard's inputs, shared by every job that runs it. Inputs are empty on a
# push, which the guard reads as a real run.
env:
  RELEASE_REF: ${{ github.ref }}
  DRY_RUN: ${{ inputs.dry_run }}
  VERSION_OVERRIDE: ${{ inputs.version }}
  BRANCH_OVERRIDE: ${{ inputs.branch }}

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      dry_run: ${{ steps.guard.outputs.dry_run }}
      build: ${{ steps.guard.outputs.build }}
      publish: ${{ steps.guard.outputs.publish }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard orders versions against every tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - id: guard
        run: bun --no-install --config=/dev/null scripts/release-guard.ts

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: ccmux-macos-arm64
          - target: bun-darwin-x64
            artifact: ccmux-macos-x64
          - target: bun-linux-x64
            artifact: ccmux-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Runner workspace only, so the binary reports the version under test.
      - name: Apply the dry run's version
        if: needs.guard.outputs.dry_run == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
      - run: bun install --os="*" --cpu="*"
      - run: bun run build
      # --no-compile-autoload-bunfig: keep bunfig's dev-only `preload`
      # (@opentui/solid/preload) out of the compiled binary. build.ts already
      # applies it; at runtime it can't resolve and crashes ("preload not found").
      - run: bun build dist/index.js --compile --no-compile-autoload-bunfig --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}
      - name: Smoke test
        if: matrix.artifact == 'ccmux-linux-x64'
        run: |
          set -euo pipefail
          expected=$(jq -r .version package.json)
          binary="$PWD/${{ matrix.artifact }}"
          export CCMUX_HOME="$RUNNER_TEMP/ccmux-home"
          mkdir "$CCMUX_HOME"
          # Outside the checkout, so nothing resolves from the repo by accident.
          cd "$RUNNER_TEMP"

          actual=$("$binary" --version)
          echo "--version: $actual (expected $expected)"
          test "$actual" = "$expected"

          "$binary" completion bash > completion.bash
          test -s completion.bash
          bash -n completion.bash

          "$binary" config set theme nord
          actual=$("$binary" config get theme)
          echo "config get theme: $actual"
          test "$actual" = 'theme = "nord"'
          test -f "$CCMUX_HOME/ccmux.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Build, sign, and notarize the macOS ccmux-notifier helper app (the v2
  # actionable-notification backend). Runs in parallel with `build`; the
  # notarized zip is uploaded as the `notifier-app` artifact and folded into
  # the release assets by the `package` job. The artifact name intentionally
  # does NOT match `ccmux-*` so that job's binary-flattening loop skips it.
  notarize-notifier:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: notifier
    env:
      APP_NAME: ccmux-notifier
      SCHEME: ccmux-notifier
      CONFIG: Release
      ARCHIVE_PATH: build/ccmux-notifier.xcarchive
      EXPORT_DIR: build/export
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Resolve version
        id: version
        run: |
          echo "semver=${{ needs.guard.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        run: |
          MISSING=0
          for secret in TEAM_ID NOTARIZE_APPLE_ID NOTARIZE_PASSWORD \
                        MACOS_CERT_BASE64 MACOS_CERT_PASSWORD; do
            if [ -z "$(eval echo \$$secret 2>/dev/null || echo '')" ]; then
              echo "Missing: $secret"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "Required secrets are missing."
            echo "Configure them in: Settings > Secrets and variables > Actions"
            exit 1
          fi
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate build configuration
        run: |
          mkdir -p Configurations
          cat > Configurations/Local.xcconfig << EOF
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare ExportOptions.plist
        run: |
          mkdir -p build
          sed "s/__TEAM_ID__/${{ secrets.TEAM_ID }}/g" \
            ExportOptions.plist > build/ExportOptions.plist

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "${{ secrets.NOTARIZE_APPLE_ID }}" \
            --password "${{ secrets.NOTARIZE_PASSWORD }}" \
            --team-id "${{ secrets.TEAM_ID }}"

      - name: Archive
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          mkdir -p build
          # Universal (arm64 + x86_64) comes from project.yml's Release
          # ARCHS = $(ARCHS_STANDARD); do not override ARCHS here.
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ steps.version.outputs.semver }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build_number }} \
            clean archive

      - name: Export signed app
        timeout-minutes: 2
        run: |
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Sign with hardened runtime
        run: |
          set -euxo pipefail
          APP_BUNDLE="$EXPORT_DIR/$APP_NAME.app"
          IDENTITY="Developer ID Application"
          ENTITLEMENTS="$APP_NAME.entitlements"
          # No embedded frameworks in this thin helper; sign the bundle only.
          codesign --force --sign "$IDENTITY" -o runtime --timestamp \
            --entitlements "$ENTITLEMENTS" "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Notarize
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          ditto -c -k --keepParent "$EXPORT_DIR/$APP_NAME.app" "build/notarize.zip"
          # Capture notarytool's exit code without `set -e` aborting the step,
          # so the failure diagnostics below (log fetch) still run when the
          # submission errors or is rejected.
          SUBMIT_STATUS=0
          SUBMIT_OUT=$(xcrun notarytool submit "build/notarize.zip" \
            --keychain-profile "notary-profile" \
            --wait 2>&1) || SUBMIT_STATUS=$?
          echo "$SUBMIT_OUT"
          # `|| true`: a missing id (failed submit) must not itself abort here.
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | grep -m1 'id:' | awk '{print $2}') || true
          echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV
          if [ "$SUBMIT_STATUS" -ne 0 ] || ! echo "$SUBMIT_OUT" | grep -q "status: Accepted"; then
            echo "Notarization failed (notarytool exit $SUBMIT_STATUS). Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "notary-profile" || true
            exit 1
          fi
          rm -f "build/notarize.zip"

      - name: Staple notarization
        run: |
          set -euxo pipefail
          for i in 1 2 3; do
            if xcrun stapler staple "$EXPORT_DIR/$APP_NAME.app" 2>&1; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Staple failed after 3 attempts. Fetching notarization log..."
              xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "notary-profile" || true
              exit 1
            fi
            echo "Staple attempt $i failed, retrying in 15s..."
            sleep 15
          done
          xcrun stapler validate "$EXPORT_DIR/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$EXPORT_DIR/$APP_NAME.app"

      - name: Create notarized ZIP
        run: |
          ditto -c -k --keepParent "$EXPORT_DIR/$APP_NAME.app" "build/ccmux-notifier.zip"

      - name: Upload notifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifier-app
          path: notifier/build/ccmux-notifier.zip

  # Assembles everything the publishing jobs upload, with read access only, so
  # a dry run exercises the same steps a release does.
  package:
    needs: [guard, build, notarize-notifier]
    # A dry run skips notarization, and a skipped need would skip this job too.
    if: >-
      !cancelled() &&
      needs.guard.outputs.build == 'true' &&
      needs.build.result == 'success' &&
      (needs.notarize-notifier.result == 'success' ||
       needs.guard.outputs.dry_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          # Only the compiled binaries (each artifact is a dir holding one
          # like-named file). The notifier zip is fetched separately below so
          # the flattening loop never sees it.
          pattern: ccmux-*
          path: dist

      - name: Prepare release assets
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            mv "${dir}${name}" "${name}.tmp"
          done
          rm -rf */
          for f in *.tmp; do
            mv "$f" "${f%.tmp}"
          done
          chmod +x ccmux-*
          ls -la

      - name: Download notifier app artifact
        if: needs.guard.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: notifier-app
          path: dist-notifier

      - name: Stage notifier zip
        if: needs.guard.outputs.publish == 'true'
        run: mv dist-notifier/ccmux-notifier.zip dist/ccmux-notifier.zip

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt

      - name: Generate Homebrew formulas
        env:
          # Track the publishing repo so formula URLs survive the rename.
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.guard.outputs.version }}
          DRY_RUN: ${{ needs.guard.outputs.dry_run }}
        run: |
          set -euo pipefail
          sha() { sha256sum "dist/$1" | awk '{print $1}'; }
          SHA_MACOS_ARM64=$(sha ccmux-macos-arm64)
          SHA_MACOS_X64=$(sha ccmux-macos-x64)
          SHA_LINUX_X64=$(sha ccmux-linux-x64)
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: no notarized helper app, so its sha256 is a placeholder."
            SHA_NOTIFIER_APP=$(printf '0%.0s' {1..64})
          else
            SHA_NOTIFIER_APP=$(sha ccmux-notifier.zip)
          fi
          export SHA_MACOS_ARM64 SHA_MACOS_X64 SHA_LINUX_X64 SHA_NOTIFIER_APP

          bash scripts/update-homebrew-formula.sh formulas/ccmux.rb
          CLASS_NAME=CcmuxRc \
          DESCRIPTION="Monitor AI coding agent sessions running in tmux (release candidate)" \
          CONFLICTS_WITH=ccmux \
            bash scripts/update-homebrew-formula.sh formulas/ccmux-rc.rb
          for formula in formulas/*.rb; do ruby -c "$formula"; done

      - name: Upload release assets
        if: needs.guard.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Upload formulas
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formulas
          path: formulas/*.rb
          if-no-files-found: error

  release:
    needs: [guard, build, notarize-notifier, package]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Building and notarizing take minutes, and the other branch may have
      # released meanwhile, so decide and rank again on the tags as they are now.
      - name: Guard against the current tags
        id: guard
        run: bun --no-install --config=/dev/null scripts/release-guard.ts

      - name: Stop unless this is still publishable
        if: steps.guard.outputs.publish != 'true'
        run: |
          echo "::error::The version's tag appeared while this run was building."
          exit 1

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create and push tag
        env:
          TAG: v${{ needs.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          generate_release_notes: true
          # Versions with a pre-release suffix (1.5.0-rc.1) publish as GitHub
          # pre-releases: visible for testing, never "latest".
          prerelease: ${{ needs.guard.outputs.prerelease }}
          # Explicit, because GitHub's default would mark a 1.4.x patch latest
          # over a newer stable line.
          make_latest: ${{ steps.guard.outputs.highest_stable }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  request-site-deploy:
    needs: [guard, release]
    if: needs.guard.outputs.publish == 'true' && needs.guard.outputs.prerelease == 'false'
    uses: ./.github/workflows/deploy-site.yml
    permissions: {}
    secrets:
      CCMUX_SITE_DEPLOY_TOKEN: ${{ secrets.CCMUX_SITE_DEPLOY_TOKEN }}

  homebrew:
    needs: [guard, package, release]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # One tap writer at a time, so each ranks itself after the previous push.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    # Soft-fail: a tap-update hiccup must not fail the release. Needs the
    # HOMEBREW_TAP_GITHUB_TOKEN secret (PAT with push to epilande/homebrew-tap).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Reports "skip" here, since the release job pushed this version's tag.
      # Only the ranking is used: the stable formula follows the highest stable,
      # the rc formula the highest version overall (an rc tester is carried
      # forward onto the stable that supersedes it).
      - name: Rank against the current tags
        id: rank
        run: bun --no-install --config=/dev/null scripts/release-guard.ts

      - name: Download formulas
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formulas
          path: formulas

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: epilande/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Commit and push formulas
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          HIGHEST_STABLE: ${{ steps.rank.outputs.highest_stable }}
          HIGHEST_OVERALL: ${{ steps.rank.outputs.highest_overall }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$HIGHEST_STABLE" = "true" ]; then
            cp ../formulas/ccmux.rb Formula/ccmux.rb
            git add Formula/ccmux.rb
          fi
          if [ "$HIGHEST_OVERALL" = "true" ]; then
            cp ../formulas/ccmux-rc.rb Formula/ccmux-rc.rb
            git add Formula/ccmux-rc.rb
          fi
          if git diff --staged --quiet; then
            echo "Formulas unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update ccmux to v$VERSION"
          # Rebase onto any concurrent tap writes.
          git pull --rebase
          git push
